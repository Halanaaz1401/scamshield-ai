AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ScamShield AI - Serverless Backend Infrastructure (Free Tier Zero-Cost Architecture)

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: python3.12
  Api:
    MethodSettings:
      - ResourcePath: "/*"
        HttpMethod: "*"
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 20

Parameters:
  GeminiApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Optional Google Gemini API Key for AI Intent Reasoning Layer
  GeminiModelId:
    Type: String
    Default: gemini-2.5-flash
    Description: Google Gemini Model ID
  GoogleWebRiskApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Optional Google Web Risk API Key for Live Threat Intelligence
  AllowedOrigin:
    Type: String
    Default: "*"
    Description: Allowed CORS Origin (Amplify domain or *)

Resources:
  ScamShieldApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: !Sub "'${AllowedOrigin}'"

  AnalyzeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: src.handlers.analyze.handler
      Environment:
        Variables:
          GEMINI_API_KEY: !Ref GeminiApiKey
          GEMINI_MODEL_ID: !Ref GeminiModelId
          GOOGLE_WEB_RISK_API_KEY: !Ref GoogleWebRiskApiKey
          ALLOWED_ORIGINS: !Ref AllowedOrigin
          DYNAMODB_TABLE_NAME: !Ref ReportsTable
          REPORTS_TABLE: !Ref ReportsTable
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref ReportsTable
      Events:
        AnalyzeApi:
          Type: Api
          Properties:
            RestApiId: !Ref ScamShieldApi
            Path: /analyze
            Method: POST
        HealthApi:
          Type: Api
          Properties:
            RestApiId: !Ref ScamShieldApi
            Path: /health
            Method: GET

  ReportsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: analysis_id
          AttributeType: S
      KeySchema:
        - AttributeName: analysis_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

Outputs:
  ApiUrl:
    Description: API Gateway Base URL
    Value: !Sub "https://${ScamShieldApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  AnalyzeUrl:
    Description: POST /analyze URL
    Value: !Sub "https://${ScamShieldApi}.execute-api.${AWS::Region}.amazonaws.com/prod/analyze"
  HealthUrl:
    Description: GET /health URL
    Value: !Sub "https://${ScamShieldApi}.execute-api.${AWS::Region}.amazonaws.com/prod/health"
  ReportsTableName:
    Description: DynamoDB Table Name
    Value: !Ref ReportsTable
  FunctionArn:
    Description: Lambda Function ARN
    Value: !GetAtt AnalyzeFunction.Arn
